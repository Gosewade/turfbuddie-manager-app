name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create . --platforms=android --org com.turfbuddie --project-name turfbuddie_manager
      - run: flutter pub get
      - name: App name
        run: sed -i 's/android:label="[^"]*"/android:label="TurfBuddie Manager"/' android/app/src/main/AndroidManifest.xml
      - name: App icon
        continue-on-error: true
        run: dart run flutter_launcher_icons
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: turfbuddie-manager-apk
          path: build/app/outputs/flutter-apk/app-release.apk
